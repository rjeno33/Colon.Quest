<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title> Colon Quest</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div class="box">

<div id="mainApp">
<hr>
<h1> Colon Quest Admin</h1>

<div class="appointmentBox">

<h2>Care Provider</h2>

<select id="profileSelect">
    <option value="">-- Select care provider --</option>
    <option value="testFlexible"> Test - Flexible Times</option>
    <option value="sheffield">Sheffield Teaching Hospitals</option>
    
</select>

<h2>Hospital Site</h2>

<select id="siteSelect">

</select>

<h2>Bowel Preparation</h2>

<label for="prepSelect">
    Select the patient's bowel preparation
</label>

<select id="prepSelect">
    <option value="">-- Select bowel preparation --</option>
    <option value="plenvu">Plenvu</option>
    <option value="moviprep">Moviprep</option>
    <option value="picolax">Picolax</option>
    <option value="extended">Extended Prep - 6 Satchet Moviprep</option>
</select>

<h2>Medications</h2>


<div class="medicationSelection">

    <h3>Medication selection</h3>

    <label>
        <input type="checkbox" id="ironSelect">
        Iron supplements
    </label>

    <label>
        <input type="checkbox" id="mounjaroSelect">
        Mounjaro
    </label>

    <label>
    <input type="checkbox" id="loperamideSelect">
    Loperamide
</label>

    <label>
        <input type="checkbox" id="ramiprilSelect">
        Ramipril
    </label>

</div>

    <div class="steroidSelection">

    <h3>Steroid Medication</h3>

    <label>
        <input type="checkbox" id="steroidSelect">
        Patient takes steroid medication
    </label>

    <div id="steroidDoseBox" style="display: none;">

        <label for="steroidDose">
            Enter the additional steroid dose prescribed
        </label>

        <input
            type="text"
            id="steroidDose"
            placeholder="e.g. 5mg Prednisolone"
        >

    </div>

</div>

    <div class="anticoagulationSelection">

    <h3>Anticoagulation / Antiplatelet Medication</h3>

    <label for="anticoagulationSelect">
        Does the patient take an anticoagulant or antiplatelet medication?
    </label>

    <select id="anticoagulationSelect">

        <option value="">-- Select medication status --</option>
        <option value="none">No</option>
        <option value="apixaban">Apixaban</option>
        <option value="edoxaban">Edoxaban</option>
        <option value="rivaroxaban">Rivaroxaban</option>
        <option value="dabigatran">Dabigatran</option>
        <option value="clopidogrel">Clopidogrel</option>
        <option value="warfarin">Warfarin</option>

    </select>

    <div id="medicationPathway"></div>

</div>

    <h2>Appointment Details</h2>

    <label for="appointmentDate">
        Select patient appointment date and time
    </label>

    <input
        id="appointmentDate"
        type="datetime-local">

    <button id="createPlanButton">
        Create Patient Plan
    </button>


<button id="clearDateButton">
    Reset Plan
</button>

</div>

<div id="planSummary"></div>

<!-- Page 1: Personalised patient plan -->
<div id="plan"></div>

<!-- Page 2: Low residue diet information -->
<div id="lowResidueDietPage"></div>

<button id="printPlanButton">
    🖨️ Print Patient Plan
</button>
    <div id="printPlan"></div>
 


<p> Colon Quest Admin v0.1 </p>
<p> Created By </p>
<p> Ryan Jennings </p>
</div>



<hr>

<script src="script.js"></script>

</body>
</html>
